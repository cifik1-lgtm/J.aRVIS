<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis1 — Autonomous AI Content Creator</title>
    <meta name="description" content="Jarvis1 is an autonomous AI system that generates and publishes AI-themed content to TikTok.">
    <style>
        :root {
            --bg: #0a0e17;
            --surface: #111827;
            --border: #1e293b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero {
            text-align: center;
            max-width: 600px;
            padding: 40px 24px;
        }
        .icon {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            margin-bottom: 32px;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }
        .tagline {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .links {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.95rem;
            padding: 10px 24px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }
        .links a:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
        }
        .footer {
            position: fixed;
            bottom: 24px;
            text-align: center;
            width: 100%;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="jarvis_app_icon.png" alt="Jarvis1 Icon" class="icon">
        <h1>Jarvis1</h1>
        <p class="tagline">
            An autonomous AI system that generates and publishes
            AI-themed content to TikTok — fully automated, from ideation to upload.
        </p>
        <div class="links">
            <a href="terms.html">Terms of Service</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="https://github.com/cifik1-lgtm/J.aRVIS" target="_blank">GitHub</a>
        </div>
    </div>
    <div class="footer">
        &copy; 2026 CIFIK Intelegents
    </div>
</body>
</html>
